<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>WA Web Chat Exporter</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="chat">
        <div class="chat-text">
            <h1 id="chatName" class="chat-name" translate="no" data-i18n="noChatTitle">No chat open</h1>
            <p id="chatMeta" class="chat-meta muted" data-i18n="metaDetecting">Looking for the open chat…</p>
        </div>
        <button type="button" id="openOptions" class="icon-button" data-i18n-aria-label="openOptions" data-i18n-title="openOptions">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h10M18 7h2M4 17h4M12 17h8" />
                <circle cx="16" cy="7" r="2" />
                <circle cx="10" cy="17" r="2" />
            </svg>
        </button>
    </header>

    <form id="exportForm" novalidate>
        <fieldset class="group" id="scopeGroup">
            <legend class="group-title" data-i18n="whatToExport">What to export</legend>

            <label class="choice">
                <input type="radio" name="extractMode" value="count">
                <span data-i18n="scopeLast">Last</span>
                <input type="number" id="messageCount" class="field count-field" min="1" step="10" inputmode="numeric" autocomplete="off" data-i18n-aria-label="scopeCountLabel">
                <span data-i18n="scopeMessages">messages</span>
            </label>

            <label class="choice">
                <input type="radio" name="extractMode" value="date">
                <span data-i18n="scopeRange">Between two dates</span>
            </label>
            <div id="dateFields" class="date-fields" hidden>
                <label class="date-row">
                    <span class="date-label" data-i18n="scopeFrom">From</span>
                    <input type="datetime-local" id="startTime" class="field">
                </label>
                <label class="date-row">
                    <span class="date-label" data-i18n="scopeTo">To</span>
                    <input type="datetime-local" id="endTime" class="field">
                </label>
            </div>

            <label class="choice">
                <input type="radio" name="extractMode" value="all">
                <span data-i18n="scopeAll">Whole chat</span>
            </label>
        </fieldset>

        <fieldset class="group format-group">
            <legend class="group-title" data-i18n="format">Format</legend>
            <div class="segmented">
                <label><input type="radio" name="exportFormat" value="txt"><span translate="no">TXT</span></label>
                <label><input type="radio" name="exportFormat" value="json"><span translate="no">JSON</span></label>
                <label><input type="radio" name="exportFormat" value="csv"><span translate="no">CSV</span></label>
            </div>
        </fieldset>

        <fieldset class="group" id="includeGroup">
            <legend class="group-title" data-i18n="include">Include</legend>

            <label class="option">
                <input type="checkbox" id="captureThumbnails">
                <span class="option-text" data-i18n="incThumbnails">Photo and video thumbnails</span>
            </label>

            <div class="option-block">
                <label class="option">
                    <input type="checkbox" id="enableAiCaptions" aria-describedby="aiNote">
                    <span class="option-text" data-i18n="incAi">Image descriptions and voice transcripts</span>
                    <span class="tag-network" data-i18n="usesNetwork">Uses network</span>
                </label>
                <p id="aiNote" class="option-note muted" data-i18n="incAiNote" hidden></p>
                <p id="aiMissing" class="option-note muted" hidden>
                    <span data-i18n="incAiMissing">Needs a Gemini key.</span>
                    <button type="button" id="aiSetup" class="button-text" data-i18n="aiSetup">Add key</button>
                </p>
            </div>

            <div class="option-block wajs-only">
                <label class="option">
                    <input type="checkbox" id="syncOlderFromPhone" aria-describedby="olderNote">
                    <span class="option-text" data-i18n="incOlder">Older messages from your phone</span>
                    <span class="tag-network" data-i18n="usesNetwork">Uses network</span>
                </label>
                <p id="olderNote" class="option-note muted" data-i18n="incOlderNote" hidden></p>
            </div>

            <div class="option-block wajs-only">
                <label class="option">
                    <input type="checkbox" id="downloadMissingMedia" aria-describedby="mediaNote">
                    <span class="option-text" data-i18n="incMedia">Recent photos and voice notes</span>
                    <span class="tag-network" data-i18n="usesNetwork">Uses network</span>
                </label>
                <p id="mediaNote" class="option-note muted" hidden></p>
            </div>
        </fieldset>

        <section id="actions" class="actions">
            <button type="submit" id="downloadBtn" class="button-primary">Download TXT</button>
            <button type="button" id="copyBtn" class="button-secondary" data-i18n="copyText">Copy text</button>
        </section>

        <section id="progress" class="progress" hidden>
            <p class="progress-count"><span id="progressCount" class="tabular">0</span> <span id="progressUnit"></span></p>
            <p id="progressPhase" class="progress-phase muted"></p>
            <div id="progressBar" class="progress-bar" role="progressbar" aria-labelledby="progressPhase">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <button type="button" id="cancelBtn" class="button-text" data-i18n="cancel">Cancel</button>
        </section>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="trust" class="trust muted" data-i18n="trustLocal">Runs in this browser. Nothing is uploaded.</p>

    <script src="../export/formatters.js"></script>
    <script src="settings.js"></script>
    <script src="i18n.js"></script>
    <script src="session.js"></script>
    <script src="popup.js"></script>
</body>

</html>
