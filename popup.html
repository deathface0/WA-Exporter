<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 350px;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #111;
        }

        h3 {
            margin-bottom: 14px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        button {
            flex: 1;
            padding: 10px;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: opacity 0.15s;
        }

        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        #copyBtn     { background: #34B7F1; }
        #downloadBtn { background: #25D366; }

        #statusMsg {
            text-align: center;
            color: #555;
            font-size: 13px;
            font-weight: 600;
            margin-top: 14px;
            min-height: 18px;
        }
    </style>
</head>

<body>
    <h3>Chat Exporter</h3>

    <div class="input-group">
        <label for="startTime">Start Timestamp</label>
        <input type="datetime-local" id="startTime">
    </div>

    <div class="input-group">
        <label for="endTime">End Timestamp</label>
        <input type="datetime-local" id="endTime">
    </div>

    <div class="btn-group">
        <button id="copyBtn">Copy Text</button>
        <button id="downloadBtn">Download TXT</button>
    </div>

    <p id="statusMsg"></p>

    <script src="popup.js"></script>
</body>

</html>
